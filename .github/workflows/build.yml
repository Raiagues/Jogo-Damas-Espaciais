name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config liballegro5-dev liballegro-image5-dev liballegro-audio5-dev liballegro-acodec5-dev xvfb xdotool
      - name: Configure with memory checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test rules
        run: ctest --test-dir build --output-on-failure
      - name: Test desktop interaction
        # Mesa/X11 may retain process-global allocations; keep address and UB checks.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: xvfb-run -a python3 tests/gui_smoke.py build/damas-espaciais

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-allegro
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
          cmake --build build
      - name: Test rules
        run: ctest --test-dir build --output-on-failure
